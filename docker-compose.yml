version: "3.8"

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: lumen
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.compose
    ports:
      - "3000:3000"
    depends_on:
      - mongo

volumes:
  mongo-data:
